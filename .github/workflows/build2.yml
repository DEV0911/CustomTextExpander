name: Build Windows EXE V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows EXE
        run: dotnet publish CustomTextExpanderV2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Show generated files
        run: Get-ChildItem -Recurse publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CustomTextExpanderV2-Windows
          path: publish/CustomTextExpanderV2.exe
